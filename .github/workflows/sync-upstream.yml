name: sync-upstream
on:
  schedule: [{cron: '17 5 * * *'}]
  workflow_dispatch:
permissions: {contents: write, pull-requests: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Merge upstream, check the E patches, and open a PR
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "vanadium-e-bot"; git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/GrapheneOS/Vanadium.git
          git fetch upstream
          [ "$(git rev-list --count HEAD..upstream/main)" -eq 0 ] && exit 0
          git checkout -B upstream-sync
          git merge --no-edit upstream/main
          # Do the Vanadium-E patches still apply on the new upstream version?
          if E/tools/check-patches.sh > check.log 2>&1; then status="PASS: Vanadium-E patches apply cleanly"; draft=""
          else status="FAIL: some Vanadium-E patches need rebasing (see log below)"; draft="--draft"; fi
          {
            echo "Automated merge of GrapheneOS/Vanadium main."
            echo
            echo "**Patch check: $status**"
            echo
            echo '```'; tail -40 check.log; echo '```'
            echo
            echo "This check does not build Chromium; a real build is still the final test."
          } > body.md
          rm check.log
          git push -f origin upstream-sync
          # Capture gh's own error text: "could not be created" alone does not say why.
          if pr_url=$(gh pr create --base main --head upstream-sync $draft --title "Sync with upstream Vanadium" --body-file body.md 2>pr_err.txt); then
            echo "Opened $pr_url"
          elif gh pr edit upstream-sync --body-file body.md 2>>pr_err.txt; then
            echo "Updated the existing pull request"
          else
            reason=$(tr '\n' ' ' < pr_err.txt | cut -c1-600)
            url="https://github.com/${GITHUB_REPOSITORY}/compare/main...upstream-sync"
            echo "::warning::Branch upstream-sync is pushed but no pull request was created. GitHub said: ${reason} | Open one manually: $url"
            { echo "### upstream-sync pushed, but no PR was created"; echo; echo "GitHub said: \`$reason\`"; echo; echo "Open one manually: $url"; echo; cat body.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
