name: sync-upstream
on:
  schedule: [{cron: '17 5 * * *'}]
  workflow_dispatch:
permissions: {contents: write, pull-requests: write}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Merge upstream into a sync branch and open PR
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          git config user.name "vanadium-e-bot"; git config user.email "bot@users.noreply.github.com"
          git remote add upstream https://github.com/GrapheneOS/Vanadium.git
          git fetch upstream
          [ "$(git rev-list --count HEAD..upstream/main)" -eq 0 ] && exit 0
          git checkout -B upstream-sync
          git merge --no-edit upstream/main
          git push -f origin upstream-sync
          gh pr create --base main --head upstream-sync --title "Sync with upstream Vanadium" --body "Automated merge of GrapheneOS/Vanadium main." || true
